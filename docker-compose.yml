services:
  postgres:
    image: postgres:17
    container_name: plutimi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plutimi
      POSTGRES_USER: plutimi
      POSTGRES_PASSWORD: plutimi
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plutimi -d plutimi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
