# Perfil de produccion (VPS).
# Todo lo sensible llega por variables de entorno y SIN valor por defecto:
# si falta alguna, la aplicacion no arranca (fail fast).

# --- Base de datos ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- OpenAPI / Swagger UI desactivados en produccion ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- CORS ---
plutimi.cors.allowed-origins=https://plutimi.andymallcco.dev
