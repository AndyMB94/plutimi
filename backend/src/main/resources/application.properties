spring.application.name=plutimi

# --- Base de datos (PostgreSQL en Docker, ver docker-compose.yml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/plutimi}
spring.datasource.username=${DB_USERNAME:plutimi}
spring.datasource.password=${DB_PASSWORD:plutimi}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
