# Configuracion comun a todos los perfiles.
# Cada perfil (application-<perfil>.properties) sobrescribe o completa estos valores.

spring.application.name=plutimi

# Perfil usado cuando no se indica ninguno (por ejemplo, al ejecutar desde IntelliJ).
# En produccion se arranca con SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Idioma ---
# Locale fijo en espanol: los mensajes de validacion no dependen del idioma del servidor
# ni de la cabecera Accept-Language del cliente.
spring.web.locale=es
spring.web.locale-resolver=fixed

# --- Paginacion (Pageable en los controllers) ---
# Si se pide un size mayor, Spring lo reduce a max-page-size.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- OpenAPI / Swagger UI ---
# Solo se documenta la API REST, no otros endpoints internos.
springdoc.paths-to-match=/api/**

# --- CORS ---
# Frontend autorizado. Valor de desarrollo (Angular en local); prod lo sobrescribe.
plutimi.cors.allowed-origins=http://localhost:4200
