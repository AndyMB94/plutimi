# Perfil de desarrollo local.

# --- Base de datos (PostgreSQL de docker-compose.yml) ---
# Valores por defecto solo para desarrollo; se pueden sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/plutimi}
spring.datasource.username=${DB_USERNAME:plutimi}
spring.datasource.password=${DB_PASSWORD:plutimi}

# --- Logs de SQL ---
# SQL generado por Hibernate, formateado y a traves del sistema de logs.
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
